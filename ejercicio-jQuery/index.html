<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Frutería La Sandía Fresca</title>
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="script.js" defer></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 40px 20px;
      line-height: 1.6;
      background-color: #f0f7f4;
      color: #264653;
    }

    #contenedor-principal,
    #contenedor-formulario {
      max-width: 480px;
      margin: 0 auto;
      background: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
      border-top: 5px solid #2a9d8f;
    }

    h1, h2 {
      color: #2a9d8f;
      margin-top: 0;
    }

    .campo {
      margin-bottom: 14px;
    }

    label {
      display: block;
      font-weight: bold;
      font-size: 0.9em;
      margin-bottom: 4px;
      color: #264653;
    }

    input {
      width: 100%;
      padding: 10px;
      box-sizing: border-box;
      border: 1px solid #c7d2cc;
      border-radius: 6px;
      font-size: 0.95em;
      background-color: #fafdfb;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: #2a9d8f;
      background-color: #ffffff;
    }

    .botones {
      margin-top: 20px;
      display: flex;
      gap: 10px;
    }

    #btn-abrir-registro,
    #btn-enviar {
      background-color: #2a9d8f;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      padding: 10px 18px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    #btn-abrir-registro:hover,
    #btn-enviar:hover {
      background-color: #21867a;
    }

    #btn-cancelar {
      background-color: #e9ecef;
      color: #495057;
      border: 1px solid #ced4da;
      border-radius: 6px;
      padding: 10px 18px;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    #btn-cancelar:hover {
      background-color: #dee2e6;
    }

    .error {
      color: #e63946;
      font-size: 0.85em;
      margin-top: 4px;
      display: block;
      font-weight: 500;
    }
  </style>
</head>
<body>

  <div id="contenedor-principal">
    <h1>Frutería La Sandía Fresca</h1>
    <p>Las mejores frutas de temporada recién traídas de la huerta.</p>
    <p>Únete a nuestro club de clientes para recibir ofertas y descuentos exclusivos.</p>
    <button id="btn-abrir-registro">Registrarse</button>
  </div>

  <div id="contenedor-formulario" style="display: none;">
    <h2>Formulario de Registro</h2>
    <form id="form-registro">
      <div class="campo">
        <label for="nombre">Nombre y apellidos:</label>
        <input type="text" id="nombre">
        <span class="error" id="error-nombre"></span>
      </div>

      <div class="campo">
        <label for="email">Correo electrónico:</label>
        <input type="text" id="email">
        <span class="error" id="error-email"></span>
      </div>

      <div class="campo">
        <label for="telefono">Teléfono:</label>
        <input type="text" id="telefono">
        <span class="error" id="error-telefono"></span>
      </div>

      <div class="campo">
        <label for="password">Contraseña:</label>
        <input type="password" id="password">
        <span class="error" id="error-password"></span>
      </div>

      <div class="botones">
        <button type="submit" id="btn-enviar">Enviar datos</button>
        <button type="button" id="btn-cancelar">Cancelar</button>
      </div>
    </form>
  </div>

</body>
</html>
