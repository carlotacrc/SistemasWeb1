<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>JS - Ejercicio 1</title>
  <script src="script.js" defer></script>
</head>
<body>

  <div>
    <label for="numero">Número de palabras (1-10):</label>
    <input type="number" id="numero" value="4" min="1" max="10">
  </div>

  <div>
    <input type="checkbox" id="checkMayus" checked>
    <label for="checkMayus">Comenzar cada palabra en mayúsculas</label>
  </div>

  <div>
    <input type="checkbox" id="checkNoRepetir" checked>
    <label for="checkNoRepetir">No repetir palabras</label>
  </div>

  <button id="boton">Generar Contraseña</button>

  <p id="resultado"></p>

</body>
</html>
